name: Release

on:
  push:
    branches: [ main ]
    paths:
      - ".fossify/release-marker.txt"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4f8f9017233a5f1026bcd5c7af61e27f889a4167

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The repository secret required for Android signing is missing: $name"
              exit 1
            fi
          done

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/file-manager-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/file-manager-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleFossRelease --no-daemon

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ github.token }}
          tag_name: 1.6.6
          name: مدیریت فایل‌ها 1.6.6
          body: |
            نخستین نسخهٔ پایدار فورک فارسی‌سازی‌شدهٔ File Manager.

            - رابط کاربری فارسی بازنویسی و روان‌سازی شد.
            - نمایش تاریخ‌ها با تقویم جلالی به برنامه افزوده شد.
            - شناسهٔ مستقل برنامه برای نصب در کنار نسخهٔ Fossify انتخاب شد.
          files: app/build/outputs/apk/foss/release/*.apk
          draft: false
          prerelease: false

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/file-manager-release.jks"
